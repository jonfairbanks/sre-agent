apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-agent-reader
  labels:
    app.kubernetes.io/name: sre-agent
# READ-ONLY — bound cluster-wide so the bot can observe all namespaces.
# Write permissions are in role-writer.yaml, scoped to specific namespaces.
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - pods/log
      - events
      - services
      - persistentvolumeclaims
      - persistentvolumes
      - resourcequotas
      - configmaps
      - serviceaccounts
      - replicationcontrollers
      - endpoints
      - limitranges
    verbs: ["get", "list", "watch"]

  # Required for the kubelet Summary API used by the PVC-utilisation collector.
  # The collector uses GET /api/v1/nodes/{node}/proxy/stats/summary.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingressclasses
      - networkpolicies
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]

  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch"]

  # Explicit custom-resource and RBAC observation permissions.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: ["secrets.hashicorp.com"]
    resources: ["vaultstaticsecrets", "vaultdynamicsecrets", "vaultauths", "vaultconnections"]
    verbs: ["get", "list"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
