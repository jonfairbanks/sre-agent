{{- if and .Values.secrets.create (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-agent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_BASE_URL: {{ .Values.secrets.anthropicBaseUrl | quote }}
  OPENAI_BASE_URL: {{ .Values.secrets.openaiBaseUrl | quote }}
  LC_GATEWAY_KEY: {{ .Values.secrets.lcGatewayKey | quote }}
  LANGSMITH_API_KEY: {{ .Values.secrets.langsmithApiKey | quote }}
  LANGSMITH_WORKSPACE_ID: {{ .Values.secrets.langsmithWorkspaceId | quote }}
  LANGSMITH_RUNS_ENDPOINTS: {{ .Values.secrets.langsmithRunsEndpoints | quote }}
  SLACK_BOT_TOKEN: {{ .Values.secrets.slackBotToken | quote }}
  SLACK_APP_TOKEN: {{ .Values.secrets.slackAppToken | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
{{- end }}
