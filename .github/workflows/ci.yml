name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests/ -q
      - name: Lint Helm chart
        run: helm lint chart --strict
      - name: Render Anthropic defaults
        run: helm template sre-agent chart --namespace sre-agent > /tmp/sre-agent-anthropic.yaml
      - name: Render OpenAI GitOps values
        run: >-
          helm template sre-agent chart
          --namespace sre-agent
          --set config.llmProvider=openai
          --set existingSecret=sre-agent-credentials
          > /tmp/sre-agent-openai.yaml
      - name: Build container
        run: docker build --tag sre-agent:ci .
